# Netlify est la cible historique du site. Vercel est la cible courante
# (voir vercel.json). Les deux fichiers doivent servir les memes en-tetes :
# sinon la conformite du site depend de l'hebergeur qui repond, ce qui n'est
# pas une propriete du site.

[build]
  publish = "."

# Le catch-all "/* -> /index.html 200" a ete retire : il renvoyait la page
# d'accueil avec un code 200 pour n'importe quelle URL inconnue. Un site
# statique multi-pages n'est pas une SPA, il doit repondre 404.

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Powered-By = ""
