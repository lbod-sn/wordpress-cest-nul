# Configuration du site statique servi par l'image de secours.
# Aligne sur les en-tetes declares dans vercel.json : les deux cibles de
# deploiement doivent servir la meme chose, sinon la conformite depend de l'hebergeur.

# Aucune banniere de version : ni dans l'en-tete Server, ni dans les pages d'erreur.
server_tokens off;

server {
    # Port non privilegie : l'image tourne en USER nginx, elle ne peut pas ouvrir le 80.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Chemins interdits : meme liste que les rewrites de vercel.json.
    # Un depot servi en clair est la premiere chose que cherche un scanner.
    location ~ /\.(git|env|github) {
        return 404;
    }

    location = /404.html {
        internal;
    }
    error_page 404 /404.html;

    location ~* \.(css|js|svg|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
