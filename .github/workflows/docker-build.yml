name: Docker Build & Push

# Chaine SDU 8.1 : build -> scan CVE -> push registre.
#
# L'image de secours n'est pas la cible de production (c'est Vercel), mais elle
# est construite et scannee a chaque changement : une CVE critique doit se voir
# avant le merge, pas le jour ou l'on doit quitter la plateforme.
#
# Conventions de tag SDU :
#   DEV  : ghcr.io/<owner>/<projet>:<branche-slug>-<sha7>
#   PROD : ghcr.io/<owner>/<projet>:vX.Y.Z   (latest proscrit comme reference de deploiement)

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
    tags: ['v*.*.*']
  workflow_dispatch:

# Rien en ecriture en tete de fichier : les portees en ecriture sont declarees
# job par job, au plus pres de ce qui en a besoin.
permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build, scan et publication
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push de l'image dans GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Le tag de reference suit la convention SDU. Aucun "latest" n'est publie :
      # un deploiement doit toujours pouvoir revenir sur une image immuable.
      - name: Calcul des tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-{{sha}}
            type=ref,event=pr,prefix=pr-,suffix=-{{sha}}
            type=semver,pattern=v{{version}}
          flags: |
            latest=false

      # Etape 1 : build local, sans publication. On scanne avant de publier,
      # sinon l'image vulnerable existe deja dans le registre quand on l'apprend.
      - name: Build de l'image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Etape 2 : scan CVE bloquant. Le scan tourne aussi sur les PR (amendement
      # 2026-08-06) : il doit pouvoir empecher le merge, pas seulement alerter apres.
      - name: Scan CVE (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      # Etape 3 : publication. Jamais sur une PR : le registre ne doit contenir
      # que des images issues d'une branche d'integration ou d'un tag de version.
      - name: Connexion au registre
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push registre
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Attestations de provenance : trace ce qui a construit l'image.
          provenance: mode=max
          sbom: true
