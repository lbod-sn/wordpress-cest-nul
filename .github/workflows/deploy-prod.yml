name: Deploy Production

# Deploiement de production sur Vercel.
#
# Exigences SDU couvertes ici :
#   3.1  le declenchement est explicite : un tag de version, jamais une poussee de branche
#   3.3  l'environnement GitHub "production" porte la regle d'approbation manuelle
#   8.3  un smoke-test d'exposition valide le deploiement avant promotion
#   11.2 le retour arriere est documente et executable sans rebuild (voir job "rollback")
#
# Le deploiement se fait a partir du tag : l'artefact promu est immuable et
# identifiable. Aucun deploiement de production ne part de "main" directement.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de version a deployer (ex : v1.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.tag || github.ref_name }}

jobs:
  deploy:
    name: Promotion en production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    # L'approbation manuelle et les secrets vivent sur cet environnement.
    # Sans lui, ce workflow deploierait sans controle : il ne doit pas etre retire.
    environment:
      name: production
      url: ${{ steps.vercel.outputs.url }}
    outputs:
      url: ${{ steps.vercel.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.VERSION }}

      # Un echec de secret doit se lire en une ligne, pas dans une trace Vercel.
      - name: Verification des secrets requis
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          manquants=""
          for nom in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -z "${!nom}" ] && manquants="$manquants $nom"
          done
          if [ -n "$manquants" ]; then
            echo "::error::Secrets absents de l'environnement production :$manquants"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      # Garde-fou : on ne promeut pas un site dont une page reference une ressource absente.
      - name: Assemblage et verification du site
        run: node scripts/build-dist.mjs dist

      - name: Deploiement Vercel
        id: vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deploiement $VERSION -> $url"

  smoke-test:
    name: Smoke-test d'exposition
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Verifie que le deploiement repond, sert les en-tetes attendus, et
      # n'expose aucun chemin interdit (.git/config en tete : c'est le premier
      # chemin que teste un scanner sur un site statique).
      - name: Smoke-test
        env:
          CIBLE: ${{ needs.deploy.outputs.url }}
        run: ./scripts/ci-smoke-test.sh "$CIBLE"

  rollback:
    name: Retour arriere
    needs: [deploy, smoke-test]
    if: failure() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      # Le smoke-test a echoue sur un deploiement deja promu : on repromeut
      # immediatement le deploiement de production precedent. Aucun rebuild,
      # donc aucun delai et aucun risque d'introduire une seconde difference.
      - name: Repromotion du deploiement precedent
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest rollback --yes --token="$VERCEL_TOKEN"
          echo "::warning::Production ramenee au deploiement precedent apres echec du smoke-test de ${{ env.VERSION }}"
